<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>WWMM Sub · 订阅转换</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">W</span>WWMM Sub</div><span class="host">订阅转换</span></header>
<main>
  <nav aria-label="转换方式"><button type="button" id="public-tab" aria-pressed="true">公开转换</button><button type="button" id="private-tab" aria-pressed="false">我的预设</button></nav>
  <section id="public-panel" aria-labelledby="public-title">
    <h1 id="public-title">生成你的订阅配置</h1><p class="intro">填入订阅，选择客户端和规则。无需登录。</p>
    <form id="public-form">
      <label>订阅链接<textarea id="subscriptions" rows="4" required placeholder="每行一条订阅地址，或粘贴节点分享链接" spellcheck="false"></textarea></label>
      <div class="columns"><label>客户端<select id="public-target"><option value="clash">Clash / OpenClash</option><option value="loon">Loon</option></select></label><label>远程规则<select id="rule"><option value="https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini">ACL4SSR · 通用规则</option><option value="https://raw.githubusercontent.com/yunjie-li/clash/main/clash-rule.ini">WWMM · 六个用途节点池</option><option value="custom">自定义规则地址</option></select></label></div>
      <label id="custom-rule-label" hidden>自定义 INI 地址<input id="custom-rule" type="url" placeholder="https://example.com/clash-rule.ini"></label>
      <details><summary>节点筛选与选项</summary><div class="columns"><label>Include<input id="include" placeholder="可选正则表达式" spellcheck="false"></label><label>Exclude<input id="exclude" placeholder="可选正则表达式" spellcheck="false"></label></div><div class="checks"><label><input id="emoji" type="checkbox" checked>保留国旗</label><label><input id="udp" type="checkbox" checked>开启 UDP</label><label><input id="scv" type="checkbox">跳过节点证书验证</label></div></details>
      <button class="primary" type="submit">生成并验证</button>
    </form>
  </section>
  <section id="private-panel" aria-labelledby="private-title" hidden>
    <h1 id="private-title">使用我的预设</h1><p class="intro">节点与组合在 Sub-Store 管理，这里直接生成完整配置。</p>
    <form id="unlock-form"><label>私有预设密钥<input id="key" type="password" autocomplete="off" required placeholder="输入你的私有预设密钥"></label><button class="primary" type="submit">读取我的预设</button></form>
    <div id="unlocked" hidden>
      <div class="row"><h2>Sub-Store 用途节点池</h2><button id="lock" type="button" class="quiet">锁定预设</button></div><div id="pools" class="pools" aria-label="已引用的六个用途节点池"></div>
      <p class="hint">引用六个组合的最新输出。各池的来源、节点和排序在 Sub-Store 修改。</p>
      <form id="private-form"><label>生成客户端<select id="private-target"><option value="loon">Loon</option><option value="clash">Clash / OpenClash</option></select></label><div class="notice" id="private-note">自动加入服务器上维护的个人证书、插件、Script 和 DNS。</div><button class="primary" type="submit">重新生成并验证</button></form>
    </div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" class="result" hidden aria-label="生成结果"><div class="row"><h2 id="result-title">配置已生成</h2><span id="counts" class="hint"></span></div><label>客户端下载地址<input id="output" readonly spellcheck="false"></label><div class="row actions"><div><button type="button" id="copy">复制链接</button><a id="download" class="button" download>下载配置</a></div><span id="result-note" class="hint"></span></div></section>
  <footer>个人预设需要独立密钥。请勿公开分享含有节点或个人证书的下载链接。</footer>
</main>
</body></html>
