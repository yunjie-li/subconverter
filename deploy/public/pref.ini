[common]
api_mode=true
api_access_token=public-converter-has-no-private-presets
enable_insert=false
enable_filter=false
clash_rule_base=base/clash-safe.yaml
loon_rule_base=base/loon-safe.conf
proxy_config=NONE
proxy_ruleset=NONE
proxy_subscription=NONE

[node_pref]
clash_use_new_field_name=true
clash_proxies_style=flow
clash_proxy_groups_style=block
filter_deprecated_nodes=false

[managed_config]
managed_config_prefix=https://sc.wwmm.date
write_managed_config=false

[ruleset]
enabled=true
overwrite_original_rules=true
update_ruleset_on_request=true

[server]
listen=0.0.0.0
port=25500
serve_file_root=

[advanced]
log_level=error
print_debug_info=false
max_concurrent_threads=2
max_allowed_rulesets=200
max_allowed_rules=100000
max_allowed_download_size=20971520
enable_cache=true
cache_subscription=60
cache_config=60
cache_ruleset=21600
async_fetch_ruleset=true
script_clean_context=true
skip_failed_links=true
