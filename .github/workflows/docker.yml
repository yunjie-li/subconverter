name: WWMM Build and Verify
on:
  push:
    branches: [master, codex/wwmm-public-private]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wwmm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify gateway and Loon exporter
        run: |
          python3 deploy/test_gateway.py
          python3 tests/test_loon_export.py
          python3 tests/test_ruleset_export.py
          c++ -std=c++17 -Wall -Wextra -Werror -I src tests/test_public_address.cpp -o /tmp/test-public-address
          /tmp/test-public-address
          node --check deploy/web/app.js
          node deploy/test_multiplier_filter.js
      - name: Build converter and web from this checkout
        run: |
          docker build --build-arg THREADS=2 -t wwmm/subconverter:20261105 .
          docker build -f deploy/Dockerfile.web -t wwmm/sub-web:20261105 .
      - name: Export deployment images
        run: docker save wwmm/subconverter:20261105 wwmm/sub-web:20261105 | gzip > wwmm-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wwmm-images-${{ github.sha }}
          path: wwmm-images.tar.gz
          retention-days: 7
